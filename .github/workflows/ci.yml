name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck test scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tests/*.sh
      - name: VPC CIDR layout tests
        run: bash tests/vpc_cidr_layout_test.sh

  terraform:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for Terraform root
        id: check
        run: |
          if [ -f terraform/main.tf ] || [ -f terraform/versions.tf ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Terraform root not added yet; skipping validate."
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.present == 'true'
        with:
          terraform_version: "1.9.8"
      - name: Terraform fmt
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform init -backend=false
      - name: Terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform validate
