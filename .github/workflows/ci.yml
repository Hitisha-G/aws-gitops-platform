name: ci

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck test scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tests/*.sh
      - name: VPC CIDR layout tests
        run: make test

  terraform:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for Terraform root
        id: check
        run: |
          if [ -f terraform/main.tf ] || [ -f terraform/versions.tf ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Terraform root not added yet; skipping validate."
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.present == 'true'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Cache Terraform providers
        if: steps.check.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-
      - name: Terraform fmt
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform init -backend=false
      - name: Terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
        if: steps.check.outputs.present == 'true'
        with:
          tflint_version: v0.53.0
      - name: Cache TFLint plugins
        if: steps.check.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('terraform/**/.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.os }}-
      - name: TFLint init
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: tflint --init
      - name: TFLint
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: tflint --recursive
