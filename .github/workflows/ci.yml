name: ci

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "terraform/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  workflow-lint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color

  unit:
    runs-on: ubuntu-latest
    needs: [workflow-lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ShellCheck test scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck tests/*.sh tests/lib/*.sh
      - name: Shell unit tests (tests/*.sh)
        run: make test

  iac-scan:
    name: checkov (report-only)
    runs-on: ubuntu-latest
    needs: [workflow-lint]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: pip install --quiet checkov==3.3.29
      # Report-only for now: findings land in code scanning and the job summary
      # without blocking merges. Flip off --soft-fail once the backlog is clear.
      - name: Scan Terraform with Checkov
        run: |
          checkov -d terraform --framework terraform \
            --soft-fail --compact --quiet \
            -o cli -o sarif --output-file-path console,checkov.sarif \
            | tee checkov.txt
          {
            echo "### Checkov findings"
            echo '```'
            cat checkov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('checkov.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov-terraform

  terraform:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for Terraform root
        id: check
        run: |
          if [ -f terraform/main.tf ] || [ -f terraform/versions.tf ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Terraform root not added yet; skipping validate."
          fi
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.present == 'true'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Cache Terraform providers
        if: steps.check.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-
      - name: Terraform fmt
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform fmt -check -diff -recursive
      - name: Require dependency lock file
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: |
          if [ ! -f .terraform.lock.hcl ]; then
            echo "::error::Missing .terraform.lock.hcl — run terraform providers lock and commit it."
            exit 1
          fi
      - name: Terraform init
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform init -backend=false
      - name: Terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        if: steps.check.outputs.present == 'true'
        with:
          tflint_version: v0.53.0
      - name: Cache TFLint plugins
        if: steps.check.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('terraform/**/.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.os }}-
      - name: TFLint init
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: tflint --init
      - name: TFLint
        if: steps.check.outputs.present == 'true'
        working-directory: terraform
        run: tflint --recursive

  terraform-min:
    name: terraform validate (minimum version)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 10
    # versions.tf promises required_version >= 1.6.0, so validate against the
    # oldest supported release too. Catches syntax or functions that only exist
    # in newer Terraform before they reach someone pinned to 1.6.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read minimum Terraform version
        id: min
        run: |
          floor=$(sed -nE 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*">=[[:space:]]*([0-9]+\.[0-9]+)\.[0-9]+".*/\1/p' terraform/versions.tf)
          if [ -z "$floor" ]; then
            echo "::error file=terraform/versions.tf::Could not parse a '>= X.Y.Z' required_version constraint."
            exit 1
          fi
          echo "series=$floor" >> "$GITHUB_OUTPUT"
          echo "Validating against the latest Terraform $floor.x release"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ steps.min.outputs.series }}.x"
          terraform_wrapper: false
      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
